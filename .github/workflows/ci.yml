name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_BASH: "5.3"
  BASH_SHA256: 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install shellcheck 0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          echo "$PWD/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: shellcheck --version
      - run: shellcheck --severity=warning -e SC1091 shmutant.sh test/run.sh test/mutants.sh

  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: CHECKSUMS matches shmutant.sh
        run: sha256sum -c CHECKSUMS

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: cache bash ${{ env.CI_BASH }}
        id: cache-bash
        uses: actions/cache@v6.1.0
        with:
          path: ~/bash-${{ env.CI_BASH }}
          key: bash-${{ env.CI_BASH }}-${{ env.BASH_SHA256 }}-${{ runner.os }}-${{ runner.arch }}
      - name: build bash ${{ env.CI_BASH }}
        if: steps.cache-bash.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o bash.tar.gz "https://ftp.gnu.org/gnu/bash/bash-${CI_BASH}.tar.gz"
          echo "${BASH_SHA256}  bash.tar.gz" | sha256sum -c -
          tar -xzf bash.tar.gz
          cd "bash-${CI_BASH}"
          ./configure --prefix="$HOME/bash-${CI_BASH}" > /dev/null
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
      - name: put bash ${{ env.CI_BASH }} first on PATH
        run: echo "$HOME/bash-${CI_BASH}/bin" >> "$GITHUB_PATH"
      - run: bash --version
      - name: the floor guard re-executes from an old bash
        run: /bin/bash shmutant.sh version
      - name: suite
        run: bash test/run.sh
      - name: self-mutation
        run: bash shmutant.sh run test/mutants.sh --workdir "$RUNNER_TEMP/mutants" --keep > mutants.tsv
      - name: verdicts
        if: always()
        run: cat mutants.tsv || true
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: mutants-linux
          path: |
            mutants.tsv
            ${{ runner.temp }}/mutants/*/output
            ${{ runner.temp }}/mutants/*/verdict

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: brew install bash
      - name: put Homebrew bash first on PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: bash --version
      - name: the floor guard re-executes from bash 3.2
        run: /bin/bash shmutant.sh version
      - name: suite
        run: bash test/run.sh
      - name: self-mutation
        run: bash shmutant.sh run test/mutants.sh --workdir "$RUNNER_TEMP/mutants" --keep > mutants.tsv
      - name: verdicts
        if: always()
        run: cat mutants.tsv || true
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: mutants-macos
          path: |
            mutants.tsv
            ${{ runner.temp }}/mutants/*/output
            ${{ runner.temp }}/mutants/*/verdict
