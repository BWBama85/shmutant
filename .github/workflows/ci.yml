name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_BASH: "5.3"
  BASH_SHA256: 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba
  BATS_VERSION: "1.14.0"
  BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5
  SHELLSPEC_VERSION: "0.28.1"
  SHELLSPEC_SHA256: 350d3de04ba61505c54eda31a3c2ee912700f1758b1a80a284bc08fd8b6c5992

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install shellcheck 0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          echo "$PWD/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: shellcheck --version
      - run: shellcheck --severity=warning -e SC1091 shmutant.sh test/run.sh test/mutants.sh test/adapters/check.sh test/adapters/bats/test/mutants.sh test/adapters/bats/lib/parse.sh test/adapters/shellspec/spec/mutants.sh test/adapters/shellspec/lib/parse.sh scripts/release.sh test/release.sh

  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: CHECKSUMS matches shmutant.sh
        run: sha256sum -c CHECKSUMS

  release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: /bin/bash --version
      # /bin first: on macOS the driver then runs under the system bash 3.2 an operator may have.
      - name: the release driver, against a local origin with gh stubbed
        run: PATH="/bin:$PATH" bash test/release.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: cache bash ${{ env.CI_BASH }}
        id: cache-bash
        uses: actions/cache@v6.1.0
        with:
          path: ~/bash-${{ env.CI_BASH }}
          key: bash-${{ env.CI_BASH }}-${{ env.BASH_SHA256 }}-${{ runner.os }}-${{ runner.arch }}
      - name: build bash ${{ env.CI_BASH }}
        if: steps.cache-bash.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o bash.tar.gz "https://ftp.gnu.org/gnu/bash/bash-${CI_BASH}.tar.gz"
          echo "${BASH_SHA256}  bash.tar.gz" | sha256sum -c -
          tar -xzf bash.tar.gz
          cd "bash-${CI_BASH}"
          ./configure --prefix="$HOME/bash-${CI_BASH}" > /dev/null
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
      - name: put bash ${{ env.CI_BASH }} first on PATH
        run: echo "$HOME/bash-${CI_BASH}/bin" >> "$GITHUB_PATH"
      - run: bash --version
      - name: the floor guard re-executes from an old bash
        run: /bin/bash shmutant.sh version
      - name: suite
        run: bash test/run.sh
      - name: self-mutation
        run: bash shmutant.sh run test/mutants.sh --workdir "$RUNNER_TEMP/mutants" --keep > mutants.tsv
      - name: verdicts
        if: always()
        run: cat mutants.tsv || true
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: mutants-linux
          path: |
            mutants.tsv
            ${{ runner.temp }}/mutants/*/output
            ${{ runner.temp }}/mutants/*/verdict

  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: cache bash ${{ env.CI_BASH }}
        id: cache-bash
        uses: actions/cache@v6.1.0
        with:
          path: ~/bash-${{ env.CI_BASH }}
          key: bash-${{ env.CI_BASH }}-${{ env.BASH_SHA256 }}-${{ runner.os }}-${{ runner.arch }}
      - name: build bash ${{ env.CI_BASH }}
        if: steps.cache-bash.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o bash.tar.gz "https://ftp.gnu.org/gnu/bash/bash-${CI_BASH}.tar.gz"
          echo "${BASH_SHA256}  bash.tar.gz" | sha256sum -c -
          tar -xzf bash.tar.gz
          cd "bash-${CI_BASH}"
          ./configure --prefix="$HOME/bash-${CI_BASH}" > /dev/null
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
      - name: put bash ${{ env.CI_BASH }} first on PATH
        run: echo "$HOME/bash-${CI_BASH}/bin" >> "$GITHUB_PATH"
      - name: install Bats ${{ env.BATS_VERSION }}
        run: |
          git -c advice.detachedHead=false clone -q --depth 1 --branch "v${BATS_VERSION}" https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          got="$(git -C "$RUNNER_TEMP/bats" rev-parse HEAD)"
          [ "$got" = "$BATS_COMMIT" ] || { echo "v${BATS_VERSION} is ${got}, not ${BATS_COMMIT}"; exit 1; }
          echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"
      - name: install ShellSpec ${{ env.SHELLSPEC_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellspec.tar.gz" "https://github.com/shellspec/shellspec/releases/download/${SHELLSPEC_VERSION}/shellspec-dist.tar.gz"
          echo "${SHELLSPEC_SHA256}  $RUNNER_TEMP/shellspec.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/shellspec.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellspec" >> "$GITHUB_PATH"
      - run: bash --version
      - run: bats --version
      - run: shellspec --version
      - name: the Bats adapter in docs/integrating.md
        run: bash test/adapters/check.sh bats
      - name: the ShellSpec adapter in docs/integrating.md
        run: bash test/adapters/check.sh shellspec

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: brew install bash
      - name: put Homebrew bash first on PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: bash --version
      - name: the floor guard re-executes from bash 3.2
        run: /bin/bash shmutant.sh version
      - name: suite
        run: bash test/run.sh
      - name: self-mutation
        run: bash shmutant.sh run test/mutants.sh --workdir "$RUNNER_TEMP/mutants" --keep > mutants.tsv
      - name: verdicts
        if: always()
        run: cat mutants.tsv || true
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: mutants-macos
          path: |
            mutants.tsv
            ${{ runner.temp }}/mutants/*/output
            ${{ runner.temp }}/mutants/*/verdict
